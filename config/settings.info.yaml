# ZPrime application configuration (merged over zeusfw + site.info.yaml).

title: Dashboard

tz: "Europe/Athens"

# How many days the forecast covers (7 to 16; Open-Meteo's limit is 16). The forecast gets less reliable the
# further ahead it looks, so days beyond the first week are marked as an outlook. Changing it refetches.
forecast_days: 14

# Which weather icon the forecast shows for each day:
#   service  Open-Meteo's own daily code: the MOST SEVERE condition of the day (default). One foggy early
#            hour can make a clear day show as fog.
#   daytime  worked out from the daytime hours (07:00-21:00): thunderstorm, snow, rain or drizzle if they
#            last 2+ hours, fog only if it fills most of the day, otherwise the most common sky.
# Takes effect immediately (the cached forecast is re-read), no cache clearing needed.
forecast_day_condition: service

meta:
  - charset="UTF-8"
  - http-equiv="X-UA-Compatible" content="IE=edge"
  # viewport-fit=cover lets the page run under notches; the CSS adds the
  # safe-area insets back as padding.
  - name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"
  - name="theme-color" content="#036379"
  - name="application-name" content="Dashboard"
  - name="mobile-web-app-capable" content="yes"
  - name="apple-mobile-web-app-capable" content="yes"
  - name="apple-mobile-web-app-title" content="Dashboard"
  - name="apple-mobile-web-app-status-bar-style" content="black-translucent"
  - name="robots" content="noindex, nofollow"

favicon:
  type: image/png
  src: assets/favicon-32.png

templates:
  - './core/templates/'
  - './templates/'

css:
  - dashboard:
    src: 'css/dashboard.css'
  - forecast:
    src: 'css/forecast.css'
  - sysmon:
    src: 'css/sysmon.css'

foot_script:
  - dashboard:
    type: "text/javascript"
    src: 'js/dashboard.js'
  - forecast:
    type: "text/javascript"
    src: 'js/forecast.js'
  - sysmon:
    type: "text/javascript"
    src: 'js/sysmon.js'

multilingual: false

# Every role named in an `access:` string must be listed here, or
# SecurityClass::processRoles() hard-crashes the request. Fine-grained
# checks (the /admin user manager) are RBAC permissions, see README.md.
roles:
  anonymous: []
  authenticated: []
  owner: []

routes:
  homepage:
    title: "Home"
    name: homepage
    url: "/"
    handler: homepage
  login:
    title: "Sign in"
    url: "/login"
    handler: login
    method: get
  login_post:
    title: "Sign in"
    url: "/login"
    handler: login_post
    method: post
  logout:
    title: "Sign out"
    url: "/logout"
    handler: logout
  api_weather:
    title: "Weather"
    url: "/api/weather"
    handler: zprime_api_weather
    method: get
    access: authenticated
  link_save:
    title: "Save website"
    url: "/links/save"
    handler: zprime_link_save
    method: post
    access: authenticated
  link_icon:
    title: "Website icon"
    url: "/links/{id}/icon"
    handler: zprime_link_icon
    method: get
    access: authenticated
  link_icon_refresh:
    title: "Refresh website icon"
    url: "/links/{id}/icon/refresh"
    handler: zprime_link_icon_refresh
    method: post
    access: authenticated
  link_order:
    title: "Order websites"
    url: "/links/order"
    handler: zprime_link_order
    method: post
    access: authenticated
  link_delete:
    title: "Delete website"
    url: "/links/{id}/delete"
    handler: zprime_link_delete
    method: post
    access: authenticated
  place_save:
    title: "Save place"
    url: "/places/save"
    handler: zprime_place_save
    method: post
    access: authenticated
  api_forecast:
    title: "Forecast"
    url: "/api/forecast"
    handler: zprime_api_forecast
    method: get
    access: authenticated
  api_sysmon:
    title: "System status"
    url: "/api/sysmon"
    handler: zprime_api_sysmon
    method: get
    access: authenticated
  api_sysmon_series:
    title: "System history"
    url: "/api/sysmon/{host}/series"
    handler: zprime_api_sysmon_series
    method: get
    access: authenticated
  place_order:
    title: "Order places"
    url: "/places/order"
    handler: zprime_place_order
    method: post
    access: authenticated
  place_delete:
    title: "Delete place"
    url: "/places/{id}/delete"
    handler: zprime_place_delete
    method: post
    access: authenticated

# The header only for signed-in users; the login page stands alone.
regions:
  - notification
  - header:
      access: authenticated
  - main_content

structure:
  notification:
    - notifications
  header:
    - clock_weather
  main_content:
    # content = the matched route's own output (the login form); the two
    # dashboard blocks render nothing for a visitor who is not signed in.
    - content
    - favorite_links
    - favorite_places
    - forecast
    - system_status

modules:
  path:
    - "/web/core/modules/"
    - "/web/modules/"
  modules:
    - notifications
    - content
    - clock_weather
    - favorite_links
    - favorite_places
    - forecast
    - system_status

# The dashboard blocks belong to the home page only. Without this they also appear under every
# other page that uses the main content region (for example /admin/users).
modconf:
  favorite_links:
    display:
      homepage: {}
  favorite_places:
    display:
      homepage: {}
  forecast:
    display:
      homepage: {}
  system_status:
    display:
      homepage: {}
