# Apache virtual host for ZPrime -- plain HTTP only.
#
# No SSL directives on purpose. Once this is enabled and the hostnames
# resolve to this server, run
#
#     sudo certbot --apache -d dash.example.com -d dash.example.org
#
# and certbot adds the :443 virtual host itself and, if you let it, the
# HTTP -> HTTPS redirect. For that to work, every hostname you want a
# certificate for must be listed as ServerName / ServerAlias below.
#
# Install (Debian/Ubuntu):
#
#   sudo apt install apache2 libapache2-mod-php php-mysql php-curl php-mbstring
#   sudo a2enmod rewrite headers
#   sudo cp deploy/apache-zprime.conf /etc/apache2/sites-available/zprime.conf
#   sudo $EDITOR /etc/apache2/sites-available/zprime.conf   # hostnames + paths
#   sudo a2ensite zprime
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# The same install can be served on several hostnames: list them all as
# ServerAlias. Each hostname keeps its own sign-in cookie (README.md).
#
# Replace /var/www/zprime with the real checkout path everywhere below.
# The application root has two links the server needs to follow (fw and
# web/core, see README.md), hence FollowSymLinks.

<VirtualHost *:80>
    ServerName dash.example.com
    #ServerAlias dash.example.org
    #ServerAdmin you@example.com

    # Only web/ is public. config/ (database password), sql/, bin/, deploy/,
    # tests/ and fw/ sit outside the document root and are never served.
    DocumentRoot /var/www/zprime/web

    ErrorLog  ${APACHE_LOG_DIR}/zprime-error.log
    CustomLog ${APACHE_LOG_DIR}/zprime-access.log combined

    <Directory /var/www/zprime/web>
        # web/.htaccess does the routing (everything that is not a real file
        # goes to index.php) and needs Options and FileInfo overrides.
        Options +FollowSymLinks -Indexes
        AllowOverride All
        Require all granted

        # Only index.php may be run directly. dash.php, dash_lib.php,
        # ClassesEx.php and the generated classes/ are includes, not pages.
        <FilesMatch "\.php$">
            Require all denied
        </FilesMatch>
        <Files "index.php">
            Require all granted
        </Files>

        # Runtime data (the cached weather reading is a .json file).
        <FilesMatch "\.(json|log|tmp|fail)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # web/core is a link to the shared ZeusFW checkout. Its CSS/JS/images are
    # public (module assets load from /core/modules/...), but its PHP, YAML,
    # templates and SQL must never be fetched or executed through the web.
    <Directory /var/www/zprime/web/core>
        <FilesMatch "\.(php|ya?ml|zetem|sql|md|sh|inc|ini)$">
            Require all denied
        </FilesMatch>
    </Directory>

    <DirectoryMatch "^/var/www/zprime/web/(cache|files|classes)/">
        Require all denied
    </DirectoryMatch>

    # Keep dotfiles (.htaccess, .user.ini, .git, ...) private.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Cheap hardening headers. (Add Strict-Transport-Security only after
    # HTTPS works -- certbot's config is the place for that.)
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "same-origin"
        Header always set Permissions-Policy "geolocation=(), camera=(), microphone=()"
    </IfModule>

    # Static files change with the code, and the page adds ?timestamp to
    # its CSS/JS, so a short cache is safe.
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/png "access plus 7 days"
        ExpiresByType application/manifest+json "access plus 1 day"
    </IfModule>

    # PHP-FPM instead of mod_php? Remove libapache2-mod-php, install
    # php-fpm, `a2enmod proxy_fcgi setenvif`, `a2enconf php8.3-fpm`, and the
    # distribution's conf handles *.php. web/.user.ini then supplies the
    # upload limits that web/.htaccess gives mod_php.
</VirtualHost>
